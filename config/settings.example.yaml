app:
  host: "127.0.0.1"
  port: 7860
  output_dir: "outputs"
  offline_runtime: true
  log_level: "WARNING"

nlp:
  enabled: true
  backend: "pythainlp"
  word_engine: "newmm"
  sentence_engine: "crfcut"

# Optional local inference components; enable only after explicit local model setup.
tts:
  enabled: false
  backend: "pythaitts"
  model: "lunarlist_onnx"
  # PyThaiTTS 0.4.2 Lunarlist ONNX has a fixed 22050 Hz output and no voice selector.
  sample_rate: 22050
  model_dir: "models/pythaitts/lunarlist_onnx"

asr:
  enabled: false
  backend: "pythaiasr"
  model: "typhoon_asr"
  device: "cpu"
  sampling_rate: 16000
  # Decoder window for optional Phase 3.5 near-real-time ASR sessions.
  stream_chunk_seconds: 1.0
  model_dir: "models/pythaiasr"

llm:
  enabled: false
  backend: "ollama"
  base_url: "http://127.0.0.1:11434"
  # Ollama model name. Download only with the explicit setup command.
  model: "scb10x/typhoon2.5-qwen3-4b:latest"
  model_path: null
  temperature: 0.2
  max_tokens: 512
  system_prompt: "You are a helpful Thai-language local assistant."

app:
  host: "127.0.0.1"
  port: 7860
  output_dir: "outputs"
  offline_runtime: true
  log_level: "WARNING"

nlp:
  enabled: true
  backend: "pythainlp"
  word_engine: "newmm"
  sentence_engine: "crfcut"

# Reserved for future phases. Phase 1 provides no optional inference actions.
tts:
  enabled: false
  backend: "pythaitts"
  model: "lunarlist_onnx"
  # PyThaiTTS 0.4.2 Lunarlist ONNX has a fixed 22050 Hz output and no voice selector.
  sample_rate: 22050
  model_dir: "models/pythaitts/lunarlist_onnx"

asr:
  enabled: false
  backend: "pythaiasr"
  model: "typhoon_asr"
  device: "cpu"
  sampling_rate: 16000
  model_dir: "models/pythaiasr"

llm:
  enabled: false
  backend: "ollama"
  base_url: "http://127.0.0.1:11434"
  model: "qwen3:4b"
  model_path: null
  temperature: 0.2
  max_tokens: 512
